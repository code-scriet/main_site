<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/logo.svg" />
    <link rel="icon" type="image/jpeg" href="/logo.jpeg" />
    <!-- viewport-fit=cover → we pad bars with env(safe-area-inset-*) ourselves so the
         action bars clear the iPhone home indicator. interactive-widget=resizes-content
         makes Chrome/Android shrink the layout viewport when the on-screen keyboard
         opens, so the editor + sticky Run/Submit bar stay reachable instead of being
         pushed under the keyboard. No maximum-scale: pinch-zoom stays available. -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content"
    />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#fefdf9" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#09090b" />
    <meta name="description" content="Code Scriet Playground - An interactive coding environment supporting JavaScript, Python, C++, Java, and more" />
    <title>Playground | Code Scriet</title>
    <!-- Fonts matching main site -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;600&family=Outfit:wght@300;400;500;600;700&family=Sora:wght@400;500;600;700&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
